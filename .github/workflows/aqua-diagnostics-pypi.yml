name: AQUA-diagnostics PyPI tests
# Tests the public aqua-diagnostics release from PyPI on a platform x Python matrix.
# When the scheduled or manual run fails, an issue listing the broken tests is opened (or updated).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 2" # run every Tuesday night at 4AM UTC, after the aqua-core PyPI and Conda tests
  push:
    # if you want to edit this workflow, please create pypi-test branch and push to it
    branches:
      - pypi-test

permissions:
  contents: read

jobs:
  # Call the reusable workflow with PyPI installation
  aqua-diagnostics-pypi-tests:
    strategy:
      fail-fast: false
      # Cap on the total number of jobs running at once (platform x Python), to leave runners free for other workflows
      max-parallel: 3
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    name: AQUA-diagnostics PyPI (${{ matrix.platform }}, py${{ matrix.python-version }})
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      platform: ${{ matrix.platform }}
      # Host runners, as a user installing from PyPI (no container)
      container-image: ''
      python-version: ${{ matrix.python-version }}
      pytest-markers: 'aqua or diagnostics or ensemble'
      enable-parallel: true
      enable-coverage: false
      install-mode: 'pypi'
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}

  report-failure:
    needs: aqua-diagnostics-pypi-tests
    if: ${{ always() && needs.aqua-diagnostics-pypi-tests.result == 'failure' }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: DestinE-Climate-DT/AQUA/.github/workflows/report-failure-reusable.yml@main
    with:
      test-name: PyPI
