name: AQUA-diagnostics Test Runner (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to test (the caller owns the platform x Python matrix)'
        required: false
        type: string
        default: '3.14'
      platform:
        description: 'GitHub Actions runner label'
        required: false
        type: string
        default: 'ubuntu-latest'
      container-image:
        description: 'Container image to use (empty string = selected host runner, e.g. on macOS)'
        required: false
        type: string
        default: 'ghcr.io/destine-climate-dt/ubuntu26.04-fdb5.19.0-eccodes2.47.0-aqua:aqua-base-container'
      pytest-markers:
        description: 'Pytest markers to run (e.g., "aqua or slow")'
        required: true
        type: string
        default: 'aqua or diagnostics or ensemble'
      enable-parallel:
        description: 'Enable pytest-xdist parallel execution'
        required: false
        type: boolean
        default: true
      enable-coverage:
        description: 'Enable code coverage reporting'
        required: false
        type: boolean
        default: true
      install-mode:
        description: >-
          Installation mode: "local" (conda-lock file, Linux only),
          "environment" (environment.yml, released aqua-core),
          "pypi" (environment-pypi.yml + aqua-diagnostics from PyPI + its release tag),
          "cross-check" (environment.yml + aqua-core from aqua-core-ref)
        required: false
        type: string
        default: 'local'
      aqua-core-ref:
        description: 'aqua-core branch/tag/commit-SHA for cross-check mode (default: main)'
        required: false
        type: string
        default: 'main'
      test-data-source:
        description: 'Test data source: "dvc" (DVC only), "http" (wget only), or "auto" (DVC with HTTP fallback)'
        required: false
        type: string
        default: 'auto'
      aqua-actions-ref:
        description: 'aqua-core repository ref containing the composite CI actions'
        required: false
        type: string
        default: 'main'
    secrets:
      AQUA_GITHUB_PAT:
        required: true
      AQUA_DVC_PAT:
        required: true
      AQUA_DVC_PEM:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      POLYTOPE_KEY:
        required: true
      CODECOV_TOKEN:
        required: false


permissions:
  contents: read

defaults:
  run:
    # NOTE: We must take care with the shell value here. We have steps
    #       with multiline YAML strings.
    #       These get converted into shell scripts.
    #       If execute as ``bash -l fail_first_command.sh``
    #       then it would fail the first command but run the second
    #       command. The default value in GitHub is ``--noprofile --norc -eo pipefail``.
    #       https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    #       We removed the noprofile and norc so we have pytest set by Conda in our PATH.
    # NOTE2: login should be kept because the action micromamba/setup-micromamba
    #        writes the environment activation script in the .bashrc file.
    shell: bash -l -eo pipefail {0}

jobs:
  aqua_test:
    # Keeps the name of the former Python matrix: 'aqua-diagnostics-tests / aqua_test (3.14)' is a required check
    name: aqua_test (${{ inputs.python-version }})
    runs-on: ${{ inputs.platform }}
    continue-on-error: false

    concurrency:
      # github.event is the caller's event: PR runs cancel superseded runs, other events never do
      group: aqua-diagnostics-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.install-mode }}-${{ inputs.platform }}-py${{ inputs.python-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    container:
      # FDB container used as build environment on Linux (no FDB tests in aqua-diagnostics).
      # Pass container-image: '' from the caller to use the selected host runner without a container.
      image: ${{ inputs.container-image }}
      options: --user root

    env:
      DEBIAN_FRONTEND: noninteractive
      GRID_DEFINITION_PATH: /tmp
      GITHUB_TOKEN: ${{ secrets.AQUA_GITHUB_PAT }}
      ARTIFACT_SUFFIX: ${{ inputs.install-mode }}-${{ inputs.platform }}-py${{ inputs.python-version }}

    steps:
      # ========================================
      # 1. CHECKOUT REPOSITORIES
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: AQUA-diagnostics

      - name: Checkout aqua-core (cross-check mode)
        if: ${{ inputs.install-mode == 'cross-check' }}
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/AQUA
          ref: ${{ inputs.aqua-core-ref }} # checkout aqua-core at specified ref
          path: AQUA
          token: ${{ secrets.AQUA_GITHUB_PAT }}

      - name: Checkout shared AQUA CI actions
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/AQUA
          ref: ${{ inputs.aqua-actions-ref }}
          path: aqua-ci
          token: ${{ secrets.AQUA_GITHUB_PAT }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout Climate-DT-catalog repository
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/Climate-DT-catalog
          path: Climate-DT-catalog
          token: ${{ secrets.AQUA_GITHUB_PAT }}

      - name: Checkout DVC repo
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/aqua-dvc
          path: aqua-dvc
          token: ${{ secrets.AQUA_DVC_PAT }}

      # ========================================
      # 2. INSTALL SYSTEM DEPENDENCIES
      # ========================================
      - name: Install GH Actions dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          # Use sudo when not running as root (plain ubuntu runner)
          SUDO=$([ "$(id -u)" = "0" ] && echo "" || echo "sudo")
          # Ubuntu dependencies (Git, curl, gpg...)
          $SUDO apt-get update && \
            $SUDO apt-get install -y \
              curl \
              git \
              gpg

      - name: Install GH Actions dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install wget

      # ========================================
      # 3. SETUP PYTHON ENVIRONMENT
      # ========================================
      - name: Resolve environment for install mode
        id: resolve
        env:
          MODE: ${{ inputs.install-mode }}
        run: |
          case "$MODE" in
            local)
              if [ "$RUNNER_OS" != "Linux" ]; then
                echo "::error::install-mode 'local' uses a linux-64 lock file; use 'environment' on $RUNNER_OS"
                exit 1
              fi
              ENV_FILE=AQUA-diagnostics/conda-linux-64.lock
              ;;
            environment|cross-check)
              # pip resolves '-e .' against the cwd, so point it to the checkout explicitly
              ENV_FILE="$RUNNER_TEMP/environment.yml"
              sed "s#- -e \.#- -e ${GITHUB_WORKSPACE}/AQUA-diagnostics#" AQUA-diagnostics/environment.yml > "$ENV_FILE"
              grep -q "${GITHUB_WORKSPACE}/AQUA-diagnostics" "$ENV_FILE" || { echo "::error::'-e .' not found in environment.yml"; exit 1; }
              ;;
            pypi)
              ENV_FILE=AQUA-diagnostics/environment-pypi.yml
              ;;
            *)
              echo "::error::Unknown install-mode '$MODE'"
              exit 1
              ;;
          esac
          echo "env-file=$ENV_FILE" >> "$GITHUB_OUTPUT"

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        env:
          GITHUB_TOKEN: ''
        with:
          micromamba-version: 'latest'
          environment-file: ${{ steps.resolve.outputs.env-file }}
          environment-name: aqua-diagnostics
          cache-downloads: true
          cache-environment: false
          create-args: >-
            python=${{ inputs.python-version }}

      # ========================================
      # 4. INSTALL AQUA-DIAGNOSTICS ON TOP OF THE ENVIRONMENT
      # ========================================
      - name: Install AQUA-diagnostics (local mode)
        if: ${{ inputs.install-mode == 'local' }}
        run: |
          cd AQUA-diagnostics
          sed -n 's/^# pip //p' conda-linux-64.lock |python -m pip install -r /dev/stdin
          python -m pip install --no-deps -e .

      - name: Install aqua-core from the checked-out ref (cross-check mode)
        if: ${{ inputs.install-mode == 'cross-check' }}
        # Replaces the released aqua-core installed by environment.yml; pip adds any new aqua-core dependency
        run: python -m pip install -e "${GITHUB_WORKSPACE}/AQUA[fdb]"

      - name: Upgrade pip/setuptools/wheel
        if: ${{ inputs.install-mode == 'pypi' }}
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install aqua from PyPI with test dependencies
        if: ${{ inputs.install-mode == 'pypi' }}
        run: |
          python -m pip install aqua-diagnostics[core,tests]

      - name: Checkout the tag for PyPI mode
        if: ${{ inputs.install-mode == 'pypi' }}
        run: |
          cd AQUA-diagnostics
          PYPI_VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('aqua-diagnostics'))")
          git fetch --tags --quiet
          echo "Installed PyPI version: $PYPI_VERSION"
          git checkout "v${PYPI_VERSION}"

      # ========================================
      # 5. SETUP DVC AND TEST DATA
      # ========================================
      - name: Set up test data
        uses: ./aqua-ci/.github/actions/setup-test-data
        with:
          data-source: ${{ inputs.test-data-source }}
          dvc-repository-path: aqua-dvc
          test-data-path: AQUA-diagnostics/AQUA_tests
          dvc-pem: ${{ secrets.AQUA_DVC_PEM }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ========================================
      # 6. SETUP AQUA-DIAGNOSTICS
      # ========================================
      - name: Set up AQUA-diagnostics configuration
        uses: ./aqua-ci/.github/actions/setup-aqua
        with:
          catalogs: |
            climatedt-phase1
            ci
          polytope-key: ${{ secrets.POLYTOPE_KEY }}

      # ========================================
      # 7. VERIFY INSTALLATIONS AND SAVE ENVIRONMENT INFO
      # ========================================
      - name: Verify aqua-core and aqua-diagnostics versions
        env:
          MODE: ${{ inputs.install-mode }}
          CORE_REF: ${{ inputs.aqua-core-ref }}
        run: |
          echo "install-mode: $MODE"
          if [ "$MODE" = "cross-check" ]; then
            echo "aqua-core ref branch-tag-commitSHA: $CORE_REF"
          fi
          python -c "import aqua.core.version; print('aqua-core version:', aqua.core.version.__version__)"
          python -c "import aqua.diagnostics.version; print('aqua-diagnostics version:', aqua.diagnostics.version.__version__)"

      - name: Save environment information
        run: |
          cd AQUA-diagnostics
          micromamba list > micromamba_list.txt
          pip freeze > pip_freeze.txt

      # ========================================
      # 8. RUN TESTS
      # ========================================
      - name: Run tests
        env:
          MARKERS: ${{ inputs.pytest-markers }}
          PARALLEL: ${{ inputs.enable-parallel }}
          COVERAGE: ${{ inputs.enable-coverage }}
        run: |
          cd AQUA-diagnostics
          ARGS=(--junitxml=junit.xml -o junit_family=legacy -m "$MARKERS")
          if [ "$PARALLEL" = "true" ]; then
            # xdist_group markers run on dedicated workers
            ARGS+=(-n 4 --dist loadgroup --max-worker-restart=3)
          fi
          if [ "$COVERAGE" = "true" ]; then
            ARGS+=(--cov)
          fi
          echo "pytest ${ARGS[*]}"
          pytest "${ARGS[@]}" 2>&1 | tee aqua_pytest.log

      # ========================================
      # 9. COVERAGE REPORTS AND ARTIFACTS
      # ========================================
      - name: Collect pytest reports and upload artifacts
        if: ${{ !cancelled() }}
        uses: ./aqua-ci/.github/actions/pytest-reports
        with:
          project-path: AQUA-diagnostics
          enable-parallel: ${{ inputs.enable-parallel }}
          enable-coverage: ${{ inputs.enable-coverage }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          codecov-name: codecov-aqua-diagnostics
          artifact-name: aqua-test-artifacts-${{ env.ARTIFACT_SUFFIX }}
