name: AQUA-diagnostics Test Runner (Reusable)

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        required: true
        type: string
        default: '["3.14"]'
      pytest-markers:
        description: 'Pytest markers to run (e.g., "aqua or slow")'
        required: true
        type: string
        default: 'aqua or diagnostics or ensemble'
      enable-parallel:
        description: 'Enable pytest-xdist parallel execution'
        required: false
        type: boolean
        default: true
      enable-coverage:
        description: 'Enable code coverage reporting'
        required: false
        type: boolean
        default: true
      fail-fast:
        description: 'Stop all jobs if one fails'
        required: false
        type: boolean
        default: false
      install-mode:
        description: 'Installation mode: "local", "pypi" (from PyPI), or "cross-check" (test against aqua-core branch)'
        required: false
        type: string
        default: 'local'
      pr-number:
        description: 'Pull Request number (empty for non-PR runs)'
        required: false
        type: string
        default: ''
      aqua-core-ref:
        description: 'aqua-core branch/tag/commit-SHA for cross-check mode (default: main)'
        required: false
        type: string
        default: 'main'
      test-data-source:
        description: 'Test data source: "dvc" (DVC only), "http" (wget only), or "auto" (DVC with HTTP fallback)'
        required: false
        type: string
        default: 'auto'
      aqua-actions-ref:
        description: 'aqua-core repository ref containing the composite CI actions'
        required: false
        type: string
        default: 'main'
    secrets:
      AQUA_GITHUB_PAT:
        required: true
      AQUA_DVC_PAT:
        required: true
      AQUA_DVC_PEM:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      POLYTOPE_KEY:
        required: true
      CODECOV_TOKEN:
        required: false


permissions:
  contents: read

defaults:
  run:
    # NOTE: We must take care with the shell value here. We have steps
    #       with multiline YAML strings.
    #       These get converted into shell scripts.
    #       If execute as ``bash -l fail_first_command.sh``
    #       then it would fail the first command but run the second
    #       command. The default value in GitHub is ``--noprofile --norc -eo pipefail``.
    #       https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    #       We removed the noprofile and norc so we have pytest set by Conda in our PATH.
    # NOTE2: login should be kept because the action micromamba/setup-micromamba
    #        writes the environment activation script in the .bashrc file.
    shell: bash -l -eo pipefail {0}

jobs:
  aqua_test:
    runs-on: ubuntu-latest
    continue-on-error: false

    concurrency:
      group: ${{ inputs.pr-number != '' && format('aqua-pr-{0}-py{1}', inputs.pr-number, matrix.python-version) || format('aqua-{0}-py{1}', github.run_id, matrix.python-version) }}
      cancel-in-progress: ${{ inputs.pr-number != '' }}

    container:
      # To run FDB tests we need to use a Docker image with FDB installed.
      image: ghcr.io/destine-climate-dt/ubuntu26.04-fdb5.19.0-eccodes2.47.0-aqua:aqua-base-container
      options: --user root

    permissions:
      contents: read
      issues: write
      pull-requests: write

    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    env:
      DEBIAN_FRONTEND: noninteractive
      GRID_DEFINITION_PATH: /tmp
      FDB5_CONFIG_FILE: /app/etc/fdb/config.yaml
      GITHUB_TOKEN: ${{ secrets.AQUA_GITHUB_PAT }}

    steps:
      # ========================================
      # 1. CHECKOUT REPOSITORIES
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: AQUA-diagnostics

      - name: Checkout aqua-core (cross-check mode)
        if: ${{ inputs.install-mode == 'cross-check' }}
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/AQUA
          ref: ${{ inputs.aqua-core-ref }} # checkout aqua-core at specified ref
          path: AQUA
          token: ${{ secrets.AQUA_GITHUB_PAT }}

      - name: Checkout shared AQUA CI actions
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/AQUA
          ref: ${{ inputs.aqua-actions-ref }}
          path: aqua-ci
          token: ${{ secrets.AQUA_GITHUB_PAT }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout Climate-DT-catalog repository
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/Climate-DT-catalog
          path: Climate-DT-catalog
          token: ${{ secrets.AQUA_GITHUB_PAT }}

      - name: Checkout DVC repo
        uses: actions/checkout@v7
        with:
          repository: DestinE-Climate-DT/aqua-dvc
          path: aqua-dvc
          token: ${{ secrets.AQUA_DVC_PAT }}

      # ========================================
      # 2. INSTALL SYSTEM DEPENDENCIES
      # ========================================
      - name: Install GH Actions dependencies
        run: |
          # Ubuntu dependencies (Git, curl, gpg...)
          apt-get update && \
            apt-get install -y \
              curl \
              git \
              gpg

      # ========================================
      # 3. SETUP PYTHON ENVIRONMENT
      # ========================================
      - name: Set up Micromamba (local mode)
        if: ${{ inputs.install-mode == 'local' }}
        uses: mamba-org/setup-micromamba@v3
        env:
          GITHUB_TOKEN: ''
        with:
          micromamba-version: 'latest'
          environment-file: AQUA-diagnostics/conda-linux-64.lock
          environment-name: aqua-diagnostics
          cache-downloads: true
          cache-environment: false
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Set up Micromamba (cross-check mode)
        if: ${{ inputs.install-mode == 'cross-check' }}
        uses: mamba-org/setup-micromamba@v3
        env:
          GITHUB_TOKEN: ''
        with:
          micromamba-version: 'latest'
          environment-file: AQUA-diagnostics/environment-dev.yml
          environment-name: aqua-cross-check
          cache-downloads: true
          cache-environment: false
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Set up Micromamba (PyPI mode)
        if: ${{ inputs.install-mode == 'pypi' }}
        uses: mamba-org/setup-micromamba@v3
        env:
          GITHUB_TOKEN: ''
        with:
          micromamba-version: 'latest'
          environment-file: AQUA-diagnostics/environment-pypi.yml
          environment-name: aqua
          cache-downloads: true
          cache-environment: false
          create-args: >-
            python=${{ matrix.python-version }}

      # ========================================
      # 4. INSTALL AQUA (local mode)
      # ========================================
      - name: Install AQUA-diagnostics (local mode)
        if: ${{ inputs.install-mode == 'local' }}
        run: |
          cd AQUA-diagnostics
          sed -n 's/^# pip //p' conda-linux-64.lock |python -m pip install -r /dev/stdin
          python -m pip install --no-deps -e .

      # ========================================
      # 4. INSTALL AQUA (PyPI mode)
      # ========================================
      - name: Upgrade pip/setuptools/wheel
        if: ${{ inputs.install-mode == 'pypi' }}
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install aqua from PyPI with test dependencies
        if: ${{ inputs.install-mode == 'pypi' }}
        run: |
          python -m pip install aqua-diagnostics[core,tests]

      - name: Checkout the tag for PyPI mode
        if: ${{ inputs.install-mode == 'pypi' }}
        run: |
          cd AQUA-diagnostics
          PYPI_VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('aqua-diagnostics'))")
          git fetch --tags --quiet
          echo "Installed PyPI version: $PYPI_VERSION"
          git checkout "v${PYPI_VERSION}"

      # ========================================
      # 5. SETUP DVC AND TEST DATA
      # ========================================
      - name: Set up test data
        uses: ./aqua-ci/.github/actions/setup-test-data
        with:
          data-source: ${{ inputs.test-data-source }}
          dvc-repository-path: aqua-dvc
          test-data-path: AQUA-diagnostics/AQUA_tests
          dvc-pem: ${{ secrets.AQUA_DVC_PEM }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ========================================
      # 6. SETUP FDB
      # ========================================
      - name: Set up FDB
        uses: ./aqua-ci/.github/actions/setup-fdb
        with:
          test-data-path: AQUA-diagnostics/AQUA_tests

      # ========================================
      # 7. SETUP AQUA-DIAGNOSTICS
      # ========================================
      - name: Set up AQUA-diagnostics configuration
        uses: ./aqua-ci/.github/actions/setup-aqua
        with:
          catalogs: |
            climatedt-phase1
            ci
          polytope-key: ${{ secrets.POLYTOPE_KEY }}

      # ========================================
      # 8. VERIFY INSTALLATIONS (cross-check mode)
      # ========================================
      - name: Verify aqua-core and aqua-diagnostics versions
        if: ${{ inputs.install-mode == 'cross-check' }}
        run: |
          echo "=========================================="
          echo "Cross-check: aqua-diagnostics vs aqua-core"
          echo "aqua-core ref branch-tag-commitSHA: ${{ inputs.aqua-core-ref }}"
          echo "=========================================="
          echo ""
          echo "aqua-core version:"
          python -c "import aqua.core.version; print(aqua.core.version.__version__)"
          echo ""
          echo "aqua-diagnostics version:"
          python -c "import aqua.diagnostics.version; print(aqua.diagnostics.version.__version__)"
          echo ""

      # ========================================
      # 9. SAVE ENVIRONMENT INFO
      # ========================================
      - name: Save environment information
        run: |
          cd AQUA-diagnostics
          micromamba list > micromamba_list.txt
          pip freeze > pip_freeze.txt

      # ========================================
      # 10. RUN TESTS
      # ========================================
      - name: Run tests (parallel with coverage)
        if: ${{ inputs.enable-parallel && inputs.enable-coverage }}
        run: |
          cd AQUA-diagnostics
          echo "=========================================="
          echo "Running tests with pytest-xdist (4 cores) and coverage"
          echo "Tests with xdist_group markers will run on dedicated workers"
          echo "=========================================="

          pytest -n 4 \
            --dist loadgroup \
            --max-worker-restart=3 \
            --cov \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -m "${{ inputs.pytest-markers }}" \
            2>&1 | tee aqua_pytest.log

      - name: Run tests (parallel without coverage)
        if: ${{ inputs.enable-parallel && !inputs.enable-coverage }}
        run: |
          cd AQUA-diagnostics
          echo "=========================================="
          echo "Running tests with pytest-xdist (4 cores)"
          echo "=========================================="

          pytest -n 4 \
            --dist loadgroup \
            --max-worker-restart=3 \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -m "${{ inputs.pytest-markers }}" \
            2>&1 | tee aqua_pytest.log

      - name: Run tests (sequential with coverage)
        if: ${{ !inputs.enable-parallel && inputs.enable-coverage }}
        run: |
          cd AQUA-diagnostics
          echo "=========================================="
          echo "Running tests sequentially with coverage"
          echo "=========================================="

          pytest \
            --cov \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -m "${{ inputs.pytest-markers }}" \
            2>&1 | tee aqua_pytest.log

      - name: Run tests (sequential without coverage)
        if: ${{ !inputs.enable-parallel && !inputs.enable-coverage }}
        run: |
          cd AQUA-diagnostics
          echo "=========================================="
          echo "Running tests sequentially"
          echo "=========================================="

          pytest \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -m "${{ inputs.pytest-markers }}"

      # ========================================
      # 11. COVERAGE REPORTS AND ARTIFACTS
      # ========================================
      - name: Collect pytest reports and upload artifacts
        if: ${{ !cancelled() }}
        uses: ./aqua-ci/.github/actions/pytest-reports
        with:
          project-path: AQUA-diagnostics
          enable-parallel: ${{ inputs.enable-parallel }}
          enable-coverage: ${{ inputs.enable-coverage }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          codecov-name: codecov-aqua-diagnostics
          artifact-name: aqua-test-artifacts-py${{ matrix.python-version }}
