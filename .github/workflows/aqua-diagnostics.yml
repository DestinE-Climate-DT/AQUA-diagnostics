name: AQUA-diagnostics tests
# This workflow uses pytest-xdist to run tests in parallel across 4 cores

on:
  push:
    branches:
      - main
  pull_request:
    # 'labeled' is not a default activity type: without it, adding the
    # "run tests" label to an open PR does not trigger this workflow.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Run tests only when specific conditions are met
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.result }}
    steps:
      - name: Check if tests should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # On 'labeled' events only the label just added counts, so that adding an
          # unrelated label does not restart (and cancel) tests already running
          LABELS: ${{ github.event.action == 'labeled' && github.event.label.name || join(github.event.pull_request.labels.*.name, '|') }}
        run: |
          # Run tests if:
          # 1) PR has label "run tests" or "ready to merge" or "ready for review"
          # 2) Opened by Dependabot (not on 'labeled' events)
          # 3) Triggered manually (workflow_dispatch)
          # 4) Pushed to main branch
          SHOULD_RUN="false"

          if [[ "$LABELS" == *"run tests"* ]] || \
             [[ "$LABELS" == *"ready for review"* ]] || \
             [[ "$LABELS" == *"ready to merge"* ]] || \
             [[ "$ACTION" != "labeled" && "$PR_AUTHOR" == "dependabot[bot]" ]] || \
             [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            SHOULD_RUN="true"
          fi

          echo "result=$SHOULD_RUN" >> $GITHUB_OUTPUT

  # Call the reusable workflow
  aqua-diagnostics-tests:
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      python-versions: '["3.14"]'
      pytest-markers: 'diagnostics'
      enable-parallel: true
      enable-coverage: true
      fail-fast: false
      # Enables the concurrency group in the reusable workflow, so a new run
      # on the same PR cancels the previous one still in progress.
      pr-number: ${{ github.event.pull_request.number || '' }}
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
