name: AQUA-diagnostics tests
# Lean feature tests: ubuntu-latest, Python 3.14, FDB container (build environment only), conda-lock environment.
# Runs on PRs labelled 'run tests', 'ready for review' or 'ready to merge', on Dependabot PRs, on push to main, or manually.
# 'aqua-diagnostics-tests / aqua_test (3.14)' is a required check, so it must run (not be skipped) on every Dependabot PR.
# Dependency bumps are tested against environment.yml in aqua-diagnostics-nightly.yml, release checks live in aqua-diagnostics-release.yml.
# This workflow uses pytest-xdist to run tests in parallel across 4 cores

on:
  push:
    branches:
      - main
  pull_request:
    # 'labeled' is not a default activity type: without it, adding the
    # "run tests" label to an open PR does not trigger this workflow.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aqua-diagnostics-tests:
    # Non-PR events (listed first) always run. On PRs:
    #  - opened/synchronize/reopened: run if the PR is from Dependabot or has a test label
    #  - labeled: run only if the label just added is a test label, so that adding
    #    an unrelated label does not restart (and cancel) tests already running
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.action != 'labeled' && (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|run tests') ||
        contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|ready for review') ||
        contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|ready to merge'))) ||
      (github.event.action == 'labeled' && (
        startsWith(github.event.label.name, 'run tests') ||
        startsWith(github.event.label.name, 'ready for review') ||
        startsWith(github.event.label.name, 'ready to merge')))
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      python-version: '3.14'
      pytest-markers: 'diagnostics'
      enable-parallel: true
      enable-coverage: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
