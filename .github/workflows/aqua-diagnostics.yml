name: AQUA-diagnostics tests
# Lean feature tests: ubuntu-latest, Python 3.14, FDB container (build environment only), conda-lock environment.
# Runs on PRs labelled 'run tests', 'ready for review' or 'ready to merge', on Dependabot PRs, on push to main, or manually.
# Dependency bumps are tested against environment.yml in aqua-diagnostics-nightly.yml, release checks live in aqua-diagnostics-release.yml.
# This workflow uses pytest-xdist to run tests in parallel across 4 cores

on:
  push:
    branches:
      - main
  pull_request:
    # Adding a label is handled by aqua-diagnostics-labels.yml, which dispatches this workflow
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number, set by the label router (empty for manual runs)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  aqua-diagnostics-tests:
    # Non-PR events (listed first, including label router dispatches) always run.
    # On PR open/push: run if the PR is from Dependabot or has a test label (matched by prefix)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|run tests') ||
      contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|ready for review') ||
      contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|ready to merge')
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      python-version: '3.14'
      pytest-markers: 'diagnostics'
      enable-parallel: true
      enable-coverage: true
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
