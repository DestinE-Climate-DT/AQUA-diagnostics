name: AQUA-diagnostics tests
# This workflow uses pytest-xdist to run tests in parallel across 4 cores.
# Runs on PRs labelled 'run tests', on Dependabot PRs, on push to main, weekly, or manually.

on:
  push:
    branches:
      - main
  pull_request:
    # 'labeled' is not a default activity type: without it, adding the
    # "run tests" label to an open PR does not trigger this workflow.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # run every Monday night at 3AM UTC

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  aqua-diagnostics-tests:
    # Non-PR events (listed first) always run. On PRs:
    #  - opened/synchronize/reopened: run if the PR is from Dependabot or has the 'run tests' label
    #  - labeled: run only if the label just added is 'run tests', so that adding
    #    an unrelated label does not restart (and cancel) tests already running
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event.action != 'labeled' && (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|run tests'))) ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'run tests'))
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      python-versions: '["3.14"]'
      pytest-markers: 'diagnostics'
      enable-parallel: true
      enable-coverage: true
      fail-fast: false
      # Enables the concurrency group in the reusable workflow, so a new run
      # on the same PR cancels the previous one still in progress.
      pr-number: ${{ github.event.pull_request.number || '' }}
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
