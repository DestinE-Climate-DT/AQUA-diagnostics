name: AQUA-diagnostics Conda tests
# Tests the aqua-diagnostics release from conda-forge on a platform x Python matrix, as aqua-conda.yml in aqua-core.
# Manual only until aqua-diagnostics is published on conda-forge; then add the schedule (e.g. Tuesday after the PyPI tests).
# When the run fails, an issue listing the broken tests is opened (or updated).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Call the reusable workflow with Conda installation
  aqua-diagnostics-conda-tests:
    strategy:
      fail-fast: false
      # Cap on the total number of jobs running at once (platform x Python), to leave runners free for other workflows
      max-parallel: 3
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    name: AQUA-diagnostics Conda (${{ matrix.platform }}, py${{ matrix.python-version }})
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      platform: ${{ matrix.platform }}
      # Host runners, as a user installing from conda-forge (no container)
      container-image: ''
      python-version: ${{ matrix.python-version }}
      pytest-markers: 'aqua or diagnostics or ensemble'
      enable-parallel: true
      enable-coverage: false
      install-mode: 'conda'
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}

  report-failure:
    needs: aqua-diagnostics-conda-tests
    if: ${{ always() && needs.aqua-diagnostics-conda-tests.result == 'failure' }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: DestinE-Climate-DT/AQUA/.github/workflows/report-failure-reusable.yml@main
    with:
      test-name: Conda
