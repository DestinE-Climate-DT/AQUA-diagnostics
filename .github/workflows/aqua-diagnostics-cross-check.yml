name: AQUA-diagnostics Cross-Check

# Tests aqua-diagnostics against aqua-core (default: main) instead of PyPI release; to catch integration issues early.
# USAGE:
#   - PR: add the 'cross-check' label (runs at once and on every following push)
#   - Nightly: scheduled run against aqua-core main
#   - Manual: Actions > Run workflow > enter aqua-core ref (branch/tag/SHA)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      aqua_core_ref:
        description: 'aqua-core branch/tag/commit to test against'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cross-check-tests:
    # Non-PR events (listed first) always run. On PRs:
    #  - opened/synchronize/reopened: run if the PR has the 'cross-check' label
    #  - labeled: run only if the label just added is 'cross-check', so that adding
    #    an unrelated label does not restart (and cancel) tests already running
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.action != 'labeled' &&
        contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|cross-check')) ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'cross-check'))
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      python-versions: '["3.14"]'
      pytest-markers: 'diagnostics'
      enable-parallel: true
      enable-coverage: true
      fail-fast: false
      install-mode: 'cross-check'
      aqua-core-ref: ${{ inputs.aqua_core_ref || 'main' }}
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}
