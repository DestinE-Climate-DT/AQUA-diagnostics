name: AQUA-diagnostics release
# Full OS (min/max) x Python matrix from environment.yml (released aqua-core), on the host runners.
# Runs weekly, manually, and on PRs with the 'release' label (adding it dispatches this workflow through aqua-diagnostics-labels.yml).
# When a scheduled or manual (not label-dispatched) run fails, an issue listing the broken tests is opened (or updated).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number, set by the label router (empty for manual runs)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: "0 6 * * 1" # run every Monday at 6AM UTC, one hour after the aqua-core release tests

permissions:
  contents: read

jobs:
  aqua-diagnostics-release-tests:
    # Non-PR events (including label router dispatches) always run.
    # On PR open/push: run if the PR has the 'release' label (matched by prefix: 'wait for core release' does not count)
    if: >-
      github.event_name != 'pull_request' ||
      contains(format('|{0}', join(github.event.pull_request.labels.*.name, '|')), '|release')
    strategy:
      fail-fast: false
      # Cap on the total number of jobs running at once (platform x Python), to leave runners free for other workflows
      max-parallel: 6
      matrix:
        platform: [ubuntu-22.04, ubuntu-26.04, macos-15, xcode-27]
        python-version: ['3.12', '3.13', '3.14']
    name: AQUA-diagnostics release (${{ matrix.platform }}, py${{ matrix.python-version }})
    uses: ./.github/workflows/aqua-diagnostics-test-reusable.yml
    with:
      platform: ${{ matrix.platform }}
      container-image: ''
      python-version: ${{ matrix.python-version }}
      pytest-markers: 'diagnostics'
      enable-parallel: true
      enable-coverage: false
      install-mode: 'environment'
      test-data-source: 'auto'
    secrets:
      AQUA_GITHUB_PAT: ${{ secrets.AQUA_GITHUB_PAT }}
      AQUA_DVC_PAT: ${{ secrets.AQUA_DVC_PAT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      POLYTOPE_KEY: ${{ secrets.POLYTOPE_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AQUA_DVC_PEM: ${{ secrets.AQUA_DVC_PEM }}

  report-failure:
    needs: aqua-diagnostics-release-tests
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')) && needs.aqua-diagnostics-release-tests.result == 'failure' }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: DestinE-Climate-DT/AQUA/.github/workflows/report-failure-reusable.yml@main
    with:
      test-name: Release
