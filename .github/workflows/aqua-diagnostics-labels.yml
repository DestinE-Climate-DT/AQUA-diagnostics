name: AQUA-diagnostics label router
# Starts the test suite matching a label added to a PR, as a workflow_dispatch run on the PR head branch.
# The suites do not listen to 'labeled' events: otherwise every label would create a (skipped) run of each
# suite, and since GitHub shows only the latest run of a workflow in the PR checks, a skipped run would hide
# the real one when more labels are added at once. Dispatched runs are attached to the PR head commit.
# Labels are matched by prefix, so that e.g. 'wait for core release' does not start the release suite.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: ${{ github.event.label.name }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Dispatch the suite for the added label
        run: |
          case "$LABEL" in
            "run tests"*|"ready for review"*|"ready to merge"*) WORKFLOW=aqua-diagnostics.yml ;;
            "nightly"*) WORKFLOW=aqua-diagnostics-nightly.yml ;;
            "cross-check"*) WORKFLOW=aqua-diagnostics-cross-check.yml ;;
            "release"*) WORKFLOW=aqua-diagnostics-release.yml ;;
            *) echo "Label '$LABEL' does not start any test suite"; exit 0 ;;
          esac
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "::warning::PR from a fork ($HEAD_REPO): suites can be dispatched only on branches of $GH_REPO, ask a maintainer to run them"
            exit 0
          fi
          gh workflow run "$WORKFLOW" --ref "$HEAD_REF" -f pr_number="$PR_NUMBER"
          echo "Dispatched $WORKFLOW on $HEAD_REF for label '$LABEL' (PR #$PR_NUMBER)"
