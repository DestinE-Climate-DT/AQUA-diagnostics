datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    freq: null # if the diagnostic supports it
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null
  # Possible second/third/fourth datasets here, no present by default
  # - catalog: 'obs'
  #   model: 'ERA5'
  #   exp: 'era5'
  #   source: 'monthly'
  #   regrid: r100

references:
  - catalog: 'obs'
    model: 'ERA5'
    exp: 'era5'
    source: 'monthly'
    regrid: null

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  teleconnections:
    NAO:
      run: true
      diagnostic_name: 'nao'
      months_window: 3
      seasons: ['DJF']
      statistics_var: ['default', 'tprate']
      cbar_range: [-5, 5]
    ENSO:
      run: false
      diagnostic_name: 'enso'
      months_window: 3
      seasons: ['annual']
      statistics_var: ['default']
      cbar_range: [-2, 2]
