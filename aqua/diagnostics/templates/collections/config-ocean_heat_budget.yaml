# Configuration file for the OceanHeatBudget tool
# It compares the global ocean mean net surface heat flux with the time derivative of the ocean heat content.
# The dataset must provide slhtf, snlwrf, snswrf, ishf, tsrwe, tos and the heat content variable(s) listed below.

datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  plot_only: false # redo the figures from the saved NetCDF files, without recomputing
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  ocean_heat_budget:
    run: true                 # mandatory: switches the tool on or off
    diagnostic_name: 'ocean_heat_budget'  # mandatory: prefix of every output file (the collection name in aqua analysis)
    variables: ['hc700m']     # ocean heat content variables (J m-2), one budget each: hc300m, hc700m, hcbtm
