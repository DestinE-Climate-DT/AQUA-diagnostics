# Currently, the diagnostic supports comparing one dataset against one reference dataset at a time.
datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null

references:
  - catalog: 'obs'
    model: 'ECMWF'
    exp: 'era5'
    source: 'monthly'
    regrid: 'r100'

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  zonal:
    run: true
    diagnostic_name: 'atmosphere3d'
    variables: ['t', 'u', 'v', 'q']
    plot_params:
      default:
        ylim: [100000, 100]
        ylabel: 'Pressure (Pa)'
        cmap: 'RdBu_r'
        cmap_std: 'viridis'
