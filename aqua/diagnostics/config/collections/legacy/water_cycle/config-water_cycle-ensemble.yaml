# Currently, the diagnostic supports comparing one dataset against one reference dataset at a time.
datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null

references:
  - catalog: 'obs'
    model: 'MSWEP'
    exp: 'v2.8'
    source: 'monthly'
    regrid: 'r100'

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  lat_lon_profiles:
    run: true
    diagnostic_name: 'water_cycle'
    mean_type: 'zonal'
    variables:
      - name: 'tprate'
        regions: [null, 'tropics']  # global and tropics
