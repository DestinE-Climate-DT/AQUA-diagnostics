# Legacy configuration: config-climate_metrics-gregory.j2 rendered with the 'default' experiment kind.
# Keep it in sync with the jinja template (checked by tests/config/test_analysis_config_contract.py).

# Template according to #1613
# The first model in this block can be overridden
# in the command line by using:
# --model, --exp, --source, --outputdir, --catalog
datasets:
  - catalog: null
    model: null
    exp: null
    source: 'lra-r100-monthly'
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null
  # Possible second/third/fourth datasets here, no present by default
  # - catalog: 'obs'
  #   model: 'ECMWF'
  #   exp: 'era5'
  #   source: 'monthly'
  #   regrid: r100

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  gregory:
    run: true
    diagnostic_name: 'climate_metrics'
    t2m: '2t'
    net_toa_name: 'tnlwrf+tnswrf'
    monthly: true
    annual: true
    std: true
    std_startdate: '2001-01-01'
    std_enddate: '2024-12-31'
    # Gregory needs 2 datasets and do not care about the references block above
    t2m_ref:
      catalog: 'obs'
      model: 'BERKELEY-EARTH'
      exp: 'aqua-filled'
      source: 'r100-monthly'
    net_toa_ref:
      catalog: 'obs'
      model: 'CERES'
      exp: 'ebaf-toa421'
      source: 'monthly'
