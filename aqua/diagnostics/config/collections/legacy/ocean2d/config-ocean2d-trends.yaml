# Legacy configuration: config-ocean2d-trends.j2 rendered with the 'default' experiment kind.
# Keep it in sync with the jinja template (checked by tests/config/test_analysis_config_contract.py).

# Model-only trend maps. The analysis wrapper supplies the dataset and analysis dates.
datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    reader_kwargs: {chunks: {"time": 12}}
    startdate: null
    enddate: null

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  trends:
    run: true
    diagnostic_name: 'ocean2d'
    var: ['tos']
