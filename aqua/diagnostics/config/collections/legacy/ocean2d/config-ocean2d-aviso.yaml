# Models for which sea surface height (SSH) variability is to be evaluated.
datasets:
  - catalog: 'climatedt-phase1'
    model: 'IFS-NEMO'
    exp: 'historical-1990'
    source: 'ssh-IFS-NEMO-test'
    regrid: null
    zoom: null
    realization: null
    # TODO:
    #reader_kwargs: null #  it can be a dictionary with reader kwargs

# This is the reference model against which other models are compared.
references:
  - catalog: 'obs'
    model: 'AVISO'
    exp: 'ssh-L4'
    source: 'ssh-AVISO-test'
    regrid: null

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 600

diagnostics:
  ssh_variability:
    run: true
    diagnostic_name: 'ssh_variability'
    variables: 'zos'
    params:
      default:
        startdate_data: '1994-01-01'
        enddate_data: '1994-01-04'
        startdate_ref: '1994-01-01'
        enddate_ref: '1994-01-04'
    plot_params:
      default:
        projection: 'robinson'
        projection_params: {}
        vmin:
        vmax:
        cmap: 'RdBu_r'
        tgt_grid_name: 'r360x180'
        regrid_method: 'ycon'
      # sub region selection
      sub_region :
        name: Agulhas
        lon_limits: [5, 50]
        lat_limits: [-10, -50]
        projection: 'plate_carree'
        projection_params: {}

