# Sea surface height (SSH) variability of the ocean2d collection, on monthly data as in aqua analysis.
# Standalone configurations (e.g. on daily data) are in config/tools/variability_map/
datasets:
  - catalog: null
    model: null
    exp: null
    source: 'lra-r100-monthly'
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null

references:
  # TODO: a monthly AVISO source does not exist yet in the obs catalog (only 'daily-zarr')
  - catalog: 'obs'
    model: 'AVISO'
    exp: 'vDT2024'
    source: 'monthly'
    regrid: 'r100'
    startdate: '1993-01-01'
    enddate: '2024-12-31'

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  variabilitymap:
    run: true
    diagnostic_name: 'ocean2d'
    variables: ['zos']
    plot_params:
      default:
        contour: true
        projection: 'robinson'
        projection_params: {}
        vmin:
        vmax:
        cmap: 'RdBu_r'
        # Dataset and reference are both on r100 already, no regridding for the plots
        tgt_grid_name: null
        regrid_method: null
      # sub region selection
      sub_region:
        name: Agulhas
        lon_limits: [5, 50]
        lat_limits: [-50, -10]
        projection: 'plate_carree'
        contour: false
        projection_params: {}
