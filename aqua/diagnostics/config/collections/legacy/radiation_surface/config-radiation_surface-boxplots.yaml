# Legacy configuration: config-radiation_surface-boxplots.j2 rendered with the 'default' experiment kind.
# Keep it in sync with the jinja template (checked by tests/config/test_analysis_config_contract.py).

# Template according to #1613
# The first model in this block can be overridden
# in the command line by using:
# --model, --exp, --source, --outputdir, --catalog
datasets:
  - catalog: null
    model: IFS-NEMO
    exp: ssp370
    source: 'lra-r100-monthly'
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null
  # Possible second/third/fourth datasets here, no present by default
  # - catalog: 'obs'
  #   model: 'ECMWF'
  #   exp: 'era5'
  #   source: 'monthly'
  #   regrid: r100

references:
  - catalog: 'obs'
    model: 'ECMWF'
    exp: 'era5'
    source: 'monthly'
    regrid: 'r100'
    startdate: '1990-01-01'
    enddate: '2014-12-31'
  - catalog: 'obs'
    model: 'CERES'
    exp: 'ebaf-sfc421'
    source: 'monthly'
    regrid: 'r100'
    reader_kwargs: null
    startdate: '2001-01-01'
    enddate: '2024-12-31'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  boxplots:
    run: true
    diagnostic_name: 'radiation_surface'
    variables:
      - vars: ['-snlwrf', 'snswrf', 'slhtf', 'ishf']
        anomalies: true
        add_mean_line: true
        ref_number: 0 # use ERA5 as reference for anomalies
