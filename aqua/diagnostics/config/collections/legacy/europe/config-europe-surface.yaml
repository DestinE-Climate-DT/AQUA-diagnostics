# Legacy configuration: config-europe-surface.j2 rendered with the 'default' experiment kind.
# Keep it in sync with the jinja template (checked by tests/config/test_analysis_config_contract.py).

# Timeseries of the European mean (land and sea) of surface fields.
# 10m wind speed (10si: bias map and timeseries) to be added when the LRA provides it (o27.1, AQUA#2891).
datasets:
  - catalog: null
    model: null
    exp: null
    source: 'lra-r100-monthly'
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null

references:
  - catalog: 'obs'
    model: 'ECMWF'
    exp: 'era5'
    source: 'monthly'
    regrid: 'r100'
    startdate: '1990-01-01'
    enddate: '2014-12-31'

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  timeseries:
    run: true
    diagnostic_name: 'europe'
    variables: ['2t', 'tprate']
    center_time: true
    include_global: false  # only the regions below
    params:
      default:
        hourly: False
        daily: False
        monthly: True
        annual: True
        std_startdate: '1990-01-01'
        std_enddate: '2014-12-31'
        regions: ['europe']
      tprate:
        units: 'mm/day'
