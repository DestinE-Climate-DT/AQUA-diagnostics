# Legacy configuration: config-europe-salinity.j2 rendered with the 'default' experiment kind.
# Keep it in sync with the jinja template (checked by tests/config/test_analysis_config_contract.py).

# Sea surface salinity of the European seas, model only: no observational dataset with sos is available yet.
datasets:
  - catalog: null
    model: null
    exp: null
    source: 'lra-r100-monthly'
    regrid: null
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  timeseries:
    run: true
    diagnostic_name: 'europe'
    variables: ['sos']
    center_time: true
    include_global: false  # only the regions below
    params:
      default:
        hourly: False
        daily: False
        monthly: True
        annual: True
        regions: ['europe']
