# Legacy configuration: config-teleconnections-ocean.j2 rendered with the 'default' experiment kind.
# Keep it in sync with the jinja template (checked by tests/config/test_analysis_config_contract.py).

datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    freq: null # if the diagnostic supports it
    reader_kwargs: null # it can be a dictionary with reader kwargs
    startdate: null
    enddate: null
  # Possible second/third/fourth datasets here, no present by default
  # - catalog: 'obs'
  #   model: 'ECMWF'
  #   exp: 'era5'
  #   source: 'monthly'
  #   regrid: r100

references:
  - catalog: 'obs'
    model: 'ECMWF'
    exp: 'era5'
    source: 'monthly'
    regrid: 'r100'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  teleconnections:
    ENSO:
      run: true
      diagnostic_name: 'enso'
      months_window: 3
      seasons: ['annual']
      statistics_var: ['tos', 'tprate']
      plot_params:
        default:
          vmin: -2
          vmax: 2
          vmin_diff: -1
          vmax_diff: 1
          cmap: 'RdBu_r'
        tprate:
          vmin: -2.5
          vmax: 2.5
          vmin_diff: -4
          vmax_diff: 4
          cmap: 'BrBG'
          units: 'mm/day'
    DMI:
      run: true
      diagnostic_name: 'dmi'
      # SON is the peak of IOD events. JJA, their developing phase during the Indian summer monsoon,
      # can be added (seasons: ['JJA', 'SON']) if it proves scientifically useful.
      seasons: ['SON']
      statistics_var: ['tos', 'tprate']
      plot_params:  # limits close to the 99th percentile of |value| in SON, see notebooks/diagnostics/teleconnections/DMI.ipynb
        default:
          vmin: -1
          vmax: 1
          vmin_diff: -0.5
          vmax_diff: 0.5
          cmap: 'RdBu_r'
        tprate:
          vmin: -2
          vmax: 2
          vmin_diff: -1.5
          vmax_diff: 1.5
          cmap: 'BrBG'
          units: 'mm/day'
