# Centralized region definitions for all AQUA diagnostics.
#
# To use a custom regions file, pass ``regions_file_path`` to a diagnostic.
#
# Regions are defined with predefined regionmask objects whenever possible:
#   - ``regionmask``: a regionmask.defined_regions object (e.g. ar6.all)
#   - ``regionmask_names``: sub-regions to select and merge. If omitted, ``longname`` is used.
#   - ``frac_threshold`` (optional): select all cells whose fractional coverage by the region
#     is above the threshold (0.0 = every cell touching the region), instead of only the cells
#     whose center falls inside. Useful on coarse grids (e.g. r100).
# Regions without a predefined equivalent can still be defined with ``lon_limits``/``lat_limits``.

regions:

  # --- Land regions (IPCC AR6) ---
  # ar6.all (not ar6.land) is used for Europe because its polygons are not clipped to
  # the coastline, so coastal cells and small islands (e.g. Ireland) are less likely to be lost.
  europe:
    regionmask: ar6.all
    regionmask_names: [N.Europe, West&Central-Europe, E.Europe, Mediterranean]
    frac_threshold: 0.0
    longname: Europe

  # --- Ocean basins and seas (Natural Earth ocean_basins_50) ---

  ao:
    regionmask: natural_earth_v5_1_2.ocean_basins_50
    regionmask_names: [North Atlantic Ocean, South Atlantic Ocean]
    longname: Atlantic Ocean
  po:
    regionmask: natural_earth_v5_1_2.ocean_basins_50
    regionmask_names: [North Pacific Ocean, South Pacific Ocean]
    longname: Pacific Ocean
