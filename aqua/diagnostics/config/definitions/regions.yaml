# Centralized region definitions for all AQUA diagnostics (custom file: ``regions_file_path``).
# Polygons where possible: IPCC AR6 regions for land and atmosphere, IHO sea areas for
# oceans and seas; lon/lat boxes for everything else. Keys of a polygon region:
#   - ``regionmask``: a source below or a regionmask.defined_regions object (e.g. srex)
#   - ``regionmask_names``: sub-regions to merge (default: ``longname``)
#   - ``frac_threshold``: also keep cells covered above this fraction (default 0.0 = any touching cell,
#     null = cell centres only): coarse model grids (e.g. LRA r100) have many coastal ocean cells
#     centred on IHO land. Needs a regular lon/lat grid.

# Polygon collections: read as <name>_<simplify>.gpkg from the regions/ folder next to this file (filled when the
# container is built), otherwise downloaded once, simplified (degrees) and cached with regionmask's data.
sources:
  ar6:  # IPCC AR6 reference regions v4, Iturbide et al. (2020), doi:10.5194/essd-12-2959-2020. CC BY 4.0.
    url: "https://github.com/regionmask/regionmask/raw/v0.13.0/data/IPCC-WGI-reference-regions-v4.zip"
    names: Name
    simplify: 0
  iho:  # IHO Sea Areas v3, Flanders Marine Institute (2018), doi:10.14284/323. CC BY-NC-SA 4.0: not in this repository.
    url: "https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=MarineRegions:iho&outputFormat=SHAPE-ZIP&propertyName=name,the_geom"
    names: name
    simplify: 0.02

regions:

  # --- Land regions (IPCC AR6) ---
  # AR6 regions are not clipped to the coastline, so coastal cells and small islands (e.g. Ireland) are kept.
  europe:
    regionmask: ar6
    regionmask_names: [N.Europe, West&Central-Europe, Mediterranean]
    longname: Europe

  # --- Ocean basins and seas (IHO sea areas) ---
  # Each IHO ocean excludes its marginal seas, which are separate sea areas.

  ao:
    regionmask: iho
    regionmask_names: [North Atlantic Ocean, South Atlantic Ocean]
    longname: Atlantic Ocean
  # With the seas east of Australia and New Guinea.
  po:
    regionmask: iho
    regionmask_names: [North Pacific Ocean, South Pacific Ocean, Coral Sea, Tasman Sea, Solomon Sea, Bismarck Sea]
    longname: Pacific Ocean
  # With its marginal seas, except the much warmer and saltier Red Sea and Persian Gulf.
  io:
    regionmask: iho
    regionmask_names:
      - Indian Ocean
      - Arabian Sea
      - Bay of Bengal
      - Laccadive Sea
      - Andaman or Burma Sea
      - Gulf of Aden
      - Gulf of Oman
      - Mozambique Channel
    longname: Indian Ocean
  # With its shelf seas, the Nordic Seas and Baffin Bay. Davis Strait, mostly south of 65°N, is left out.
  arc_o:
    regionmask: iho
    regionmask_names:
      - Arctic Ocean
      - Barentsz Sea
      - Kara Sea
      - Laptev Sea
      - East Siberian Sea
      - Chukchi Sea
      - Beaufort Sea
      - Lincoln Sea
      - The Northwestern Passages
      - White Sea
      - Greenland Sea
      - Norwegian Sea
      - Baffin Bay
    longname: Arctic Ocean
  # South of 60°S: not in the IHO S-23 publication, added by Marine Regions.
  so:
    regionmask: iho
    regionmask_names: [Southern Ocean]
    longname: Southern Ocean
  ls:
    regionmask: iho
    regionmask_names: [Labrador Sea]
    longname: Labrador Sea
  lgs:
    regionmask: iho
    regionmask_names: [Labrador Sea, Greenland Sea, Norwegian Sea]
    longname: Labrador Gin Seas
  gs:
    regionmask: iho
    regionmask_names: [Greenland Sea, Norwegian Sea]
    longname: Gin Sea
  bs:
    regionmask: iho
    regionmask_names: [Bering Sea]
    longname: Bering Sea
  gom:
    regionmask: iho
    regionmask_names: [Gulf of Mexico]
    longname: Gulf of Mexico
  hb:
    regionmask: iho
    regionmask_names: [Hudson Bay]
    longname: Hudson Bay
  rs:
    regionmask: iho
    regionmask_names: [Red Sea]
    longname: Red Sea
  pg:
    regionmask: iho
    regionmask_names: [Persian Gulf]
    longname: Persian Gulf
  adr:
    regionmask: iho
    regionmask_names: [Adriatic Sea]
    longname: Adriatic Sea
  cs:
    regionmask: iho
    regionmask_names: [Caribbean Sea]
    longname: Caribbean Sea
  sj:
    regionmask: iho
    regionmask_names: [Japan Sea]
    longname: Sea of Japan
  # The Strait of Gibraltar is left out: it has no cells on coarse grids (e.g. r100),
  # which breaks the selection with frac_threshold.
  ms:
    regionmask: iho
    regionmask_names:
      - Mediterranean Sea - Western Basin
      - Mediterranean Sea - Eastern Basin
      - Alboran Sea
      - Balearic (Iberian Sea)
      - Ligurian Sea
      - Tyrrhenian Sea
      - Ionian Sea
      - Adriatic Sea
      - Aegean Sea
    longname: Mediterranean Sea
  bks:
    regionmask: iho
    regionmask_names: [Black Sea]
    longname: Black Sea
  scs:
    regionmask: iho
    regionmask_names: [South China Sea]
    longname: South China Sea
  as:
    regionmask: iho
    regionmask_names: [Arabian Sea]
    longname: Arabian Sea
  cos:
    regionmask: iho
    regionmask_names: [Coral Sea]
    longname: Coral Sea
  ts:
    regionmask: iho
    regionmask_names: [Timor Sea]
    longname: Timor Sea
  goa:
    regionmask: iho
    regionmask_names: [Gulf of Alaska]
    longname: Gulf of Alaska
  ecs:
    regionmask: iho
    regionmask_names: [Eastern China Sea]
    longname: East China Sea
  oks:
    regionmask: iho
    regionmask_names: [Sea of Okhotsk]
    longname: Sea of Okhotsk
  ps:
    regionmask: iho
    regionmask_names: [Philippine Sea]
    longname: Philippine Sea
  ans:
    regionmask: iho
    regionmask_names: [Andaman or Burma Sea]
    longname: Andaman Sea
  jas:
    regionmask: iho
    regionmask_names: [Java Sea]
    longname: Java Sea
  bfs:
    regionmask: iho
    regionmask_names: [Beaufort Sea]
    longname: Beaufort Sea

  # --- Seas that are not IHO sea areas: boxes ---
  # The Irminger Sea is part of the North Atlantic Ocean, the Weddell and Ross Seas of the
  # Southern Ocean; the Sargasso Sea has no coastline to bound it.
  is:
    longname: Irminger Sea
    lon_limits: [316, 330]
    lat_limits: [60, 70]
  ws:
    longname: Weddell Sea
    lon_limits: [295, 350]
    lat_limits: [-80, -65]
  ros:
    longname: Ross Sea
    lon_limits: [160, -150]
    lat_limits: [-78, -60]
  sss:
    longname: Sargasso Sea
    lon_limits: [-70, -50]
    lat_limits: [20, 35]

  # --- Sea ice: ---
  arctic:
    longname: Arctic
    lon_limits: [0, 360]
    lat_limits: [0, 90]
  hudson_bay:
    longname: Hudson Bay
    lon_limits: [265, 285]
    lat_limits: [50, 63]
  antarctic:
    longname: Antarctic
    lon_limits: [0, 360]
    lat_limits: [-90, 0]
  ross_sea_ice:
    longname: Ross Sea Ice
    lon_limits: [160, 230]
    lat_limits: [-90, 0]
  amundsen_bellingshausen_seas:
    longname: Amundsen-Bellingshausen Seas
    lon_limits: [230, 300]
    lat_limits: [-90, 0]
  weddell_sea_ice:
    longname: Weddell Sea Ice
    lon_limits: [300, 20]
    lat_limits: [-90, 0]

  # --- No predefined equivalent: latitude bands ---
  go:
    longname: Global Ocean
    lon_limits: [0, 360]
    lat_limits: [-90, 90]

  nh:
    longname: North Midlatitudes
    lon_limits: [-180, 180]
    lat_limits: [30, 90]
  sh:
    longname: South Midlatitudes
    lon_limits: [-180, 180]
    lat_limits: [-90, -30]
  tropics:
    longname: Tropics
    lon_limits: [-180, 180]
    lat_limits: [-15, 15]
