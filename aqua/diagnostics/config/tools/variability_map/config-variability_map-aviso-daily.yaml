# Standalone VariabilityMap configuration: sea surface height (SSH) variability from daily data.
# Not usable in aqua analysis, which runs on monthly data: see collections/legacy/ocean2d/config-ocean2d-aviso.yaml
datasets:
  - catalog: 'climatedt-gen2'
    model: 'IFS-NEMO-5km'
    exp: 'baseline-hist'
    source: 'daily-hpz7-o2d-zos'
    regrid: 'r025'
    startdate: '1994-01-01'
    enddate: '1994-03-31'
    reader_kwargs: null # it can be a dictionary with reader kwargs (e.g. fix, zoom, realization)

# This is the reference model against which other models are compared.
references:
  - catalog: 'obs'
    model: 'AVISO'
    exp: 'vDT2024'
    source: 'daily-zarr'
    regrid: null
    startdate: '1994-01-01'
    enddate: '1994-03-31'
    reader_kwargs: null

setup:
  loglevel: 'WARNING'

output:
  outputdir: "./"
  rebuild: true
  save_netcdf: true
  save_format: ['png', 'pdf', 'svg']
  dpi: 300

diagnostics:
  variabilitymap:
    run: true
    diagnostic_name: 'variability_map'
    variables: ['zos']
    plot_params:
      default:
        contour: true
        projection: 'robinson'
        projection_params: {}
        vmin:
        vmax:
        cmap: 'RdBu_r'
        tgt_grid_name: "r1440x721"
        regrid_method: 'ycon'
      # sub region selection
      sub_region:
        name: agulhas
        lon_limits: [5, 50]
        lat_limits: [-50, -10]
        projection: 'plate_carree'
        contour: false
        projection_params: {}
