# Create the environment:
# mamba env create -f environment-dev.yml
# or if you really want to use conda
# conda env create -f environment-dev.yml

name: aqua-dev
channels:
  - conda-forge
  - nodefaults
# please note that some of these dependencies are made explicit on purpose, but are not directly required by conda/mamba
dependencies:
  # binaries
  - python>=3.12,<3.15
  # smmregrid brings CDO on Linux; on macOS install CDO with Homebrew (brew install cdo)
  # keep the version aligned with the smmregrid pin in aqua-core
  - smmregrid==0.2.0
  - eccodes>=2.50.0,<2.51 # keep aligned with aqua-core
  - cartopy>=0.25.0,<=0.26.0
  - cartopy_offlinedata # this is needed for MN5 HPC
  - python-dateutil<3 # botocore requires python-dateutil<3: with 3.0.0 conda-lock backtracks through all boto3 releases
  - netcdf4>=1.7.2,<=1.7.4
  - hdf5>=2.1.0,<=2.2.0
  - h5py>=3.12.1,<=3.16.0
  # ecmean depends on esmpy binary, so we need to install it first
  - esmpy<=8.9.1
  # various
  - pip
  - pip:
    - -e ../AQUA[fdb]
    - -e .[style,notebooks,tests,docs]
