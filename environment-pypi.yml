# this is the minimal environment file to install the dependencies of AQUA-diagnostics,
# it is not meant to be used directly but is used by github actions
# Create the environment:
# mamba env create -f environment-pypi.yml
# then install AQUA-diagnostics with pip, e.g. pip install aqua-diagnostics[core]

name: aqua-diagnostics
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.12,<3.15
  # smmregrid brings CDO on Linux; on macOS install CDO with Homebrew (brew install cdo)
  - smmregrid==0.2.0
  - eccodes>=2.50.0,<2.51 # keep aligned with aqua-core
  - esmpy
  - pip
