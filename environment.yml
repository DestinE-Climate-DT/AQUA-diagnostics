# Create the environment:
# mamba env create -f environment.yml
# or if you really want to use conda
# conda env create -f environment.yml

name: aqua-diagnostics
channels:
  - conda-forge
  - nodefaults
# please note that some of these dependencies are made explicit on purpose, but are not directly required by conda/mamba
dependencies:
  # aqua-core from conda-forge brings python, smmregrid (and CDO on Linux), eccodes, cartopy, netcdf4, hdf5, h5py
  # with the pins of the aqua-core release; on macOS install CDO with Homebrew (brew install cdo)
  # keep the version in sync with pyproject.toml
  - aqua-core>=1.2.3,<1.3.0
  - cartopy_offlinedata # this is needed for MN5 HPC
  - python-dateutil<3 # botocore requires python-dateutil<3: with 3.0.0 conda-lock backtracks through all boto3 releases
  # ecmean depends on esmpy binary, so we need to install it first
  - esmpy<=8.9.1
  - pip
  - pip:
    # pip install -e of AQUA itself
    - -e .[core-fdb,tests]
    # explicit for conda-lock: with --filter-extras conda-lock drops aqua-core from the core-fdb extra,
    # without it keeps only one of core/core-fdb, so pin it here (keep in sync with pyproject.toml)
    - aqua-core[fdb]>=1.2.3
